name: Portada

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas de la portada
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portada
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portada/package-lock.json
      - run: npm ci
      - run: npm test
