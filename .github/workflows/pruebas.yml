name: Pruebas

on:
  push:
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool integration_test
      - run: flutter analyze

  modulos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/modulos

  roles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/roles

  vistas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/vistas

  paquetes:
    needs: [calidad, modulos, roles, vistas]
    strategy:
      fail-fast: false
      matrix:
        include:
          - destino: android
            sistema: ubuntu-latest
            comando: flutter build apk --release
            ruta: build/app/outputs/flutter-apk/app-release.apk
          - destino: web
            sistema: ubuntu-latest
            comando: flutter build web --release
            ruta: build/web
          - destino: windows
            sistema: windows-latest
            comando: flutter build windows --release
            ruta: build/windows/x64/runner/Release
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: ${{ matrix.comando }}
      - uses: actions/upload-artifact@v4
        with:
          name: agrogestion-${{ matrix.destino }}
          path: ${{ matrix.ruta }}
